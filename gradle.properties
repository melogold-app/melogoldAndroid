# 16 GB machine shared by agents: one build and one emulator at a time (REWRITE §6.0.7)
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.java.installations.fromEnv=JAVA_HOME,GRADLE_JAVA_HOME
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
android.usesSdkInManifest.disallowed=true
