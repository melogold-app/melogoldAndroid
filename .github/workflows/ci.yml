# CI (REWRITE §4.14.4, §6.0.10): debug build, unit tests and detekt on every push and pull request.
# R4.1 adds checkRemoved (§5.5). Actions are pinned to full commit SHAs (the tag is in the comment);
# Renovate keeps them current (helpers:pinGitHubActionDigests).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug · test · detekt
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      # Chaquopy installs yt-dlp with a build Python of the app's Python version (app/build.gradle.kts)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Android SDK packages
        run: >-
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-37.0" "ndk;29.0.14206865" "cmake;4.1.2" > /dev/null

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # --continue: a detekt finding does not hide the test results, and the other way round
      - name: assembleDebug, test, detekt
        run: ./gradlew --console=plain --continue :app:assembleDebug test detekt

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
